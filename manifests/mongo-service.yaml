# Headless Service providing direct DNS resolution for pods in the MongoDB StatefulSet.
# Used by shop-backend to establish persistent database connections via mongo:27017.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: shopkart
  labels:
    app: mongo
    app.kubernetes.io/part-of: shopkart
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP

