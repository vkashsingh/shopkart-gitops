# Deployment running replicated ShopKart backend API containers with restricted privileges.
# Connects to mongo-service via shopkart-mongo credentials and receives traffic from shop-backend Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-backend
  namespace: shopkart
  labels:
    app: shop-backend
    app.kubernetes.io/part-of: shopkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-backend
  template:
    metadata:
      labels:
        app: shop-backend
        app.kubernetes.io/part-of: shopkart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: shop-backend
          image: vkashs/shopkart-backend:c2c3376
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8080"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: shopkart-mongo
                  key: mongo-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

