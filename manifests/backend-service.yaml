# Internal ClusterIP Service exposing backend API pods on port 8080 within the cluster.
# Enables shop-frontend Nginx to proxy API calls to http://shop-backend:8080.
apiVersion: v1
kind: Service
metadata:
  name: shop-backend
  namespace: shopkart
  labels:
    app: shop-backend
    app.kubernetes.io/part-of: shopkart
spec:
  type: ClusterIP
  selector:
    app: shop-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

